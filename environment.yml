name: project_lida_-env

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.13
  - pytest
  - blackd
  - isort

  # remove/modify these as needed
  - pandas
  - mpi4py=4.1.0
  - numpy=2.2.6
  - scipy>=1.15
  - gmsh=4.13.1
  - meshio=5.3.5
  - numba=0.61.2
  - pyyaml

  # keep this to install your Python package locally
  - pip
  - pip:
    - --editable .
